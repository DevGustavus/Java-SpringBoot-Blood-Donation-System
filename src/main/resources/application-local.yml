# Configuração de desenvolvimento local.
# Credenciais e secret abaixo são apenas para desenvolvimento local (docker-compose).
# NUNCA usar em produção — em produção, definir as variáveis de ambiente.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/blooddonation}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
